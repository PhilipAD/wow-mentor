<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="How WoW Mentor works on Windows and Mac: the game draws data as colours, the bridge reads them, the server shares them, your AI reads and draws advice back into the game">
